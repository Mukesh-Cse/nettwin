[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nettwin-lab"
version = "0.1.0"
description = "Reproducible adversarial network policy verification laboratory"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
web = ["streamlit>=1.35", "fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8"]
[project.scripts]
nettwin = "nettwin.cli:main"
[tool.setuptools.packages.find]
include = ["nettwin*"]
